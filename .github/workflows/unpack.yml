name: Import MOVETRA source
on:
  push:
    paths:
      - movetra-source.zip
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: |
          unzip -o movetra-source.zip
          rm movetra-source.zip
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete MOVETRA website" || exit 0
          git push
